version: "3.9"

services:
  # --- API Gateway ---
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - cv-aggregator
      - opportunities

  # --- Microservices ---
  cv-aggregator:
    build: ./services/cv-aggregator
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - APP_ENV=development

  opportunities:
    build: ./services/opportunities
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      - APP_ENV=development

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Rate limiting zone: 100 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    # Upstream services
    upstream cv_aggregator {
        server cv-aggregator:8001;
    }
    upstream opportunities {
        server opportunities:8003;
    }

    server {
        listen 80;
        server_name api.techub.io;

        # CORS headers
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # Handle preflight
        if ($request_method = OPTIONS) {
            return 204;
        }

        # --- CV Aggregator ---
        location /api/cv/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://cv_aggregator/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --- Integrations (handled by CV Aggregator) ---
        location /api/integrations/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://cv_aggregator/integrations/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # --- Import Center (handled by CV Aggregator) ---
        location /api/import/ {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass http://cv_aggregator/import/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size 10M;
        }

        # --- Opportunities ---
        location /api/opportunities/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://opportunities/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # --- Gap Analysis (handled by Opportunities) ---
        location /api/gap-analysis/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://opportunities/gap-analysis/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # --- Auth (handled by CV Aggregator for now) ---
        location /api/auth/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://cv_aggregator/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # --- Health checks (no rate limit) ---
        location ~ ^/api/(.+)/health$ {
            proxy_pass http://$1:80/health;
        }
    }
}

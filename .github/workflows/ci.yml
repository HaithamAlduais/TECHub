name: TECHub CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  # --- Frontend (Next.js) ---
  frontend:
    name: Frontend - Lint, Typecheck, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint --filter=@techub/web

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=@techub/web

      - name: Build
        run: pnpm turbo run build --filter=@techub/web

  # --- Backend Services ---
  backend:
    name: Backend - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - cv-aggregator
          - opportunities
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: pytest tests/ -v

      - name: Health check
        working-directory: services/${{ matrix.service }}
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8080 &
          sleep 3
          curl -f http://localhost:8080/health || exit 1
          kill %1
